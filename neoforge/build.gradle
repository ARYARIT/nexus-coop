plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

version = project.mod_version
base { archivesName = 'nexus-coop-neoforge' }

repositories {
    // Mixin для компиляции берётся из Maven Central; сервер Sponge не используем, он иногда не отвечает
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.jdk as int)

neoForge {
    version = project.neo_version
}

dependencies {
    // аннотации Mixin для компиляции (в игре Mixin уже есть)
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'neo_range', project.neo_range
    inputs.property 'mc_range', project.mc_range
    inputs.property 'mixin_level', project.mixin_level
    filesMatching(['META-INF/neoforge.mods.toml', 'nexus-coop.mixins.json']) {
        expand 'version': project.version, 'neo_range': project.neo_range, 'mc_range': project.mc_range, 'mixin_level': project.mixin_level
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_release as int
}
