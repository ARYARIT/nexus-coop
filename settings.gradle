pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // версия Loom задаётся параметром -Ploom_version (для разных версий Minecraft нужны разные)
        id 'fabric-loom' version "${loom_version}"
    }
}
rootProject.name = 'nexus-coop'
