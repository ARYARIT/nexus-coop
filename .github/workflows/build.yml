  collect:
    name: all jars in one archive
    needs: [fabric, fabric26, neoforge, forge, forge7, forge112, forge17, forge19, legacyfabric, forge14, forge13]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: all
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-coop-all
          path: all/*.jar

  release:
    name: publish release coop-helper
    needs: [collect, fabric, fabric26, neoforge, forge, forge7, forge112, forge17, forge19, legacyfabric, forge14, forge13]
    # релиз выкладывает всё, что собралось: упавшая сборка одной версии не должна блокировать остальные
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: all
      - name: Build manifest
        run: |
          cd all
          python3 - <<'PY'
          import hashlib, json, os
          files = []
          for n in sorted(os.listdir('.')):
              if n.endswith('.jar'):
                  b = open(n, 'rb').read()
                  files.append({'name': n, 'sha256': hashlib.sha256(b).hexdigest(), 'size': len(b)})
          json.dump({'v': 1, 'files': files}, open('manifest.json', 'w'), indent=1)
          print(len(files), 'files')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: coop-helper
          name: NexusMC coop helper
          body: Помощники совместной игры. Лаунчер скачивает их сам (manifest.json со списком и sha256).
          prerelease: true
          make_latest: false
          files: |
            all/*.jar
            all/manifest.json
