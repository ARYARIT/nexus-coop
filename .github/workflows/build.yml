name: build-coop-helper
on:
  workflow_dispatch:
  push:

jobs:
  fabric:
    name: fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.16.5', dep: '1.16.5',            java: 8,  level: 8,  loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.18.2', dep: '1.18.2',            java: 17, level: 17, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.19.2', dep: '1.19.2',            java: 17, level: 17, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.19.4', dep: '1.19.4',            java: 17, level: 17, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.20.1', dep: '1.20.1',            java: 17, level: 17, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.20.4', dep: '1.20.4',            java: 17, level: 17, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.20.6', dep: '1.20.6',            java: 21, level: 21, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.21.1', dep: '>=1.21 <=1.21.1',   java: 21, level: 21, loader: '0.16.5',  loom: '1.7-SNAPSHOT', gradle: '8.10.2' }
          - { mc: '1.21.4', dep: '1.21.4',            java: 21, level: 21, loader: '0.16.10', loom: '1.9-SNAPSHOT', gradle: '8.14' }
          - { mc: '1.21.8', dep: '1.21.8',            java: 21, level: 21, loader: '0.16.14', loom: '1.10-SNAPSHOT', gradle: '8.14' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: >-
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          "-Pmc_dep=${{ matrix.dep }}"
          -Pjava_release=${{ matrix.java }}
          -Pmixin_level=${{ matrix.level }}
          -Ploader_version=${{ matrix.loader }}
          -Ploom_version=${{ matrix.loom }}
      - run: |
          mkdir -p out
          cp build/libs/nexus-coop-*[0-9].jar out/nexus-coop-fabric-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-fabric-${{ matrix.mc }}
          path: out/*.jar

  neoforge:
    name: neoforge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.1', neo: '21.1.172', neorange: '[21.1,21.2)', mcrange: '[1.21,1.21.2)',   mdg: '2.0.78',  gradle: '8.10.2' }
          - { mc: '1.21.4', neo: '21.4.+',   neorange: '[21.4,21.5)', mcrange: '[1.21.4,1.21.5)', mdg: '2.0.78',  gradle: '8.10.2' }
          - { mc: '1.21.8', neo: '21.8.+',   neorange: '[21.8,21.9)', mcrange: '[1.21.8,1.21.9)', mdg: '2.0.103', gradle: '8.14' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: >-
          gradle build --no-daemon
          -Pneo_version=${{ matrix.neo }}
          "-Pneo_range=${{ matrix.neorange }}"
          "-Pmc_range=${{ matrix.mcrange }}"
          -Pmdg_version=${{ matrix.mdg }}
        working-directory: neoforge
      - run: |
          mkdir -p out
          cp build/libs/nexus-coop-neoforge-*[0-9].jar out/nexus-coop-neoforge-${{ matrix.mc }}.jar
        working-directory: neoforge
      - uses: actions/upload-artifact@v4
        with:
          name: jar-neoforge-${{ matrix.mc }}
          path: neoforge/out/*.jar

  collect:
    name: all jars in one archive
    needs: [fabric, neoforge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: all
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-coop-all
          path: all/*.jar
