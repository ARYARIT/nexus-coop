// Forge 1.21.9 - 1.21.11: ForgeGradle 7. Игра здесь на официальных именах (reobf не нужен),
// поэтому MixinGradle и refmap не используются: имена в миксинах совпадают с рабочими.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = project.mod_version
group = 'dev.nexusmc'
base { archivesName = 'nexus-coop-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    // только за аннотациями Mixin для компиляции
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

processResources {
    inputs.property 'mixin_level', project.mixin_level
    inputs.property 'pack_format', project.pack_format
    filesMatching(['nexus-coop.mixins.json', 'pack.mcmeta']) {
        expand 'mixin_level': project.mixin_level, 'pack_format': project.pack_format
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes('MixinConfigs': 'nexus-coop.mixins.json')
    }
}
