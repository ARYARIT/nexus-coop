pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // для Minecraft 26.x плагин называется иначе, чем раньше
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
    }
}
rootProject.name = 'nexus-coop-fabric26'
