// Forge 1.14.4 и 1.15.2 (ForgeGradle 3, Java 8). Без Mixin: работа на событиях Forge.
// Имена классов и методов Minecraft берутся из официальных маппингов Mojang (как и в остальных проектах).
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = project.mod_version
group = 'dev.nexusmc'
archivesBaseName = 'nexus-coop-forge'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'official', version: project.mc_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.mc_version}-${project.forge_version}"
}

processResources {
    inputs.property 'loader_range', project.loader_range
    inputs.property 'pack_format', project.pack_format
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand 'loader_range': project.loader_range, 'pack_format': project.pack_format
    }
}

jar.finalizedBy('reobfJar')
